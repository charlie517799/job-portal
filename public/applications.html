<!DOCTYPE html>
<html>
<head>
<title>All Applications</title>

<style>
body{
font-family:Segoe UI;
background:#f4f7fb;
padding:30px;
}

.container{
max-width:1800px;
margin:auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.back-btn{
display:inline-block;
margin-bottom:20px;
text-decoration:none;
color:#2563eb;
font-weight:bold;
}

table{
width:100%;
border-collapse:collapse;
font-size:14px;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#2563eb;
color:white;
}

img{
width:70px;
border-radius:8px;
}

a{
color:#2563eb;
font-weight:bold;
}

.delete-btn{
background:#ef4444;
color:white;
border:none;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.delete-btn:hover{
background:#dc2626;
}
</style>

</head>
<body>

<div class="container">

<a class="back-btn" href="/admin-dashboard.html">← Back To Dashboard</a>

<h1>All Applications</h1>

<table>
<thead>
<tr>
<th>Name</th>
<th>Mobile</th>
<th>Age</th>
<th>DOB</th>
<th>Gender</th>
<th>Marital</th>
<th>Permanent Address</th>
<th>Current Address</th>
<th>Photo</th>
<th>Aadhaar</th>
<th>PAN</th>
<th>Resume</th>
<th>Action</th>
</tr>
</thead>

<tbody id="applicationsTable"></tbody>
</table>

</div>

<script>

async function deleteApplication(id){

if(!confirm("Are you sure you want to delete this application?")){
return;
}

try{

const response = await fetch(`/api/applications/${id}`,{
method:'DELETE'
});

const data = await response.json();

alert(data.message || "Application Deleted");

location.reload();

}catch(err){

alert("Delete Failed");

}

}

fetch('/api/applications')
.then(res=>res.json())
.then(data=>{

const table=document.getElementById('applicationsTable');

data.forEach(app=>{

table.innerHTML+=`
<tr>
<td>${app.full_name || ''}</td>
<td>${app.mobile || ''}</td>
<td>${app.age || ''}</td>
<td>${app.dob || ''}</td>
<td>${app.gender || ''}</td>
<td>${app.marital_status || ''}</td>
<td>${app.permanent_address || ''}</td>
<td>${app.current_address || ''}</td>

<td>
${app.photo
? `<img src="${app.photo}">`
: 'No Photo'}
</td>

<td>
${app.aadhaar
? `<a href="${app.aadhaar}" target="_blank">View</a>`
: 'No File'}
</td>

<td>
${app.pan_card
? `<a href="${app.pan_card}" target="_blank">View</a>`
: 'No File'}
</td>

<td>
${app.resume
? `<a href="${app.resume}" target="_blank">View</a>`
: 'No Resume'}
</td>

<td>
<button
class="delete-btn"
onclick="deleteApplication(${app.id})">
Delete
</button>
</td>

</tr>
`;

});

});

</script>

</body>
</html>
