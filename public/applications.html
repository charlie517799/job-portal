<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>All Applications</title>

<style>
body {
  margin: 0;
  padding: 30px;
  font-family: 'Segoe UI', sans-serif;
  background: #f1f5f9;
}

.container {
  max-width: 1200px;
  margin: auto;
  background: #fff;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

h1 {
  margin-bottom: 30px;
  text-align: center;
}

.back-btn {
  display: inline-block;
  margin-bottom: 25px;
  padding: 12px 20px;
  background: #2563eb;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-weight: 600;
}

.application-card {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 16px;
  padding: 25px;
  margin-bottom: 20px;
}

.application-card h3 {
  margin-top: 0;
}

.file-link {
  display: inline-block;
  margin-right: 12px;
  margin-top: 10px;
  color: #2563eb;
  font-weight: 600;
  text-decoration: none;
}

.empty {
  text-align: center;
  padding: 30px;
  background: #f8fafc;
  border-radius: 12px;
}

.delete-btn {
  margin-top: 20px;
  padding: 12px 18px;
  border: none;
  background: #dc2626;
  color: white;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
}

.delete-btn:hover {
  background: #b91c1c;
}
</style>
</head>
<body>

<div class="container">
  <a href="/admin-dashboard.html" class="back-btn">
    ← Back to Dashboard
  </a>

  <h1>📋 All Applications</h1>

  <div id="applications-list"></div>
</div>

<script>
async function loadApplications() {
  try {
    const response = await fetch('/api/applications');
    const applications = await response.json();

    const list = document.getElementById('applications-list');
    list.innerHTML = '';

    if (!applications.length) {
      list.innerHTML = '<div class="empty">No Applications Yet</div>';
      return;
    }

    applications.forEach(app => {
      list.innerHTML += `
        <div class="application-card">

          <h3>${app.full_name}</h3>

          <p><strong>Applied For:</strong> ${app.job_title || 'N/A'}</p>
          <p><strong>Mobile:</strong> ${app.mobile || ''}</p>
          <p><strong>Age:</strong> ${app.age || ''}</p>
          <p><strong>DOB:</strong> ${app.dob || ''}</p>
          <p><strong>Gender:</strong> ${app.gender || ''}</p>
          <p><strong>Marital Status:</strong> ${app.marital_status || ''}</p>
          <p><strong>Permanent Address:</strong> ${app.permanent_address || ''}</p>
          <p><strong>Current Address:</strong> ${app.current_address || ''}</p>

          ${app.photo ? `
            <a class="file-link" href="${app.photo}" target="_blank">
              📷 Photo
            </a>
          ` : ''}

          ${app.aadhaar ? `
            <a class="file-link" href="${app.aadhaar}" target="_blank">
              🪪 Aadhaar
            </a>
          ` : ''}

          ${app.pan_card ? `
            <a class="file-link" href="${app.pan_card}" target="_blank">
              🆔 PAN Card
            </a>
          ` : ''}

          ${app.resume ? `
            <a class="file-link" href="${app.resume}" target="_blank">
              📄 Resume
            </a>
          ` : ''}

          <br>

          <button
            class="delete-btn"
            onclick="deleteApplication(${app.id})"
          >
            Delete Application
          </button>

        </div>
      `;
    });

  } catch (error) {

    document.getElementById('applications-list').innerHTML =
      '<div class="empty">Unable to load applications</div>';

    console.error(error);
  }
}

async function deleteApplication(id) {

  const confirmDelete = confirm(
    'Are you sure you want to delete this application?'
  );

  if (!confirmDelete) return;

  try {

    const response = await fetch(`/api/applications/${id}`, {
      method: 'DELETE'
    });

    const data = await response.json();

    alert(data.message);

    loadApplications();

  } catch (error) {

    console.error(error);

    alert('Delete failed');
  }
}

loadApplications();
</script>

</body>
</html>
