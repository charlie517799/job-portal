<!DOCTYPE html>
<html>
<head>
<title>All Applications</title>
<style>
body{font-family:Segoe UI;background:#f4f7fb;padding:30px}
.container{max-width:1600px;margin:auto;background:white;padding:30px;border-radius:20px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #eee}
th{background:#2563eb;color:white}
img{width:70px}
</style>
</head>
<body>

<div class="container">
<a href="/admin-dashboard.html">← Back</a>
<h1>All Applications</h1>

<table>
<thead>
<tr>
<th>Name</th>
<th>Mobile</th>
<th>Photo</th>
<th>Aadhaar</th>
<th>PAN</th>
<th>Resume</th>
</tr>
</thead>
<tbody id="applicationsTable"></tbody>
</table>
</div>

<script>
fetch('/api/applications')
.then(res=>res.json())
.then(data=>{
const table=document.getElementById('applicationsTable');

data.forEach(app=>{
table.innerHTML+=`
<tr>
<td>${app.full_name}</td>
<td>${app.mobile}</td>
<td><img src="${app.photo}"></td>
<td><a href="${app.aadhaar}" target="_blank">View</a></td>
<td><a href="${app.pan_card}" target="_blank">View</a></td>
<td><a href="${app.resume}" target="_blank">View</a></td>
</tr>`;
});
});
</script>

</body>
</html>
