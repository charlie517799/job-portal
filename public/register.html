<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opportunity Hub Register</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
padding:20px;
}

.register-box{
width:100%;
max-width:450px;
background:rgba(255,255,255,0.12);
backdrop-filter:blur(15px);
border-radius:25px;
padding:35px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.logo{
text-align:center;
font-size:32px;
font-weight:700;
color:white;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#dbeafe;
margin-bottom:25px;
}

.input-group{
margin-bottom:15px;
}

.input-group label{
display:block;
margin-bottom:8px;
color:white;
}

.input-group input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:rgba(255,255,255,.15);
color:white;
}

.input-group input::placeholder{
color:#d1d5db;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:white;
color:#2563eb;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.login-link{
margin-top:20px;
text-align:center;
color:white;
}

.login-link a{
color:white;
font-weight:600;
}
</style>
</head>
<body>

<div class="register-box">

<div class="logo">Opportunity Hub</div>

<div class="subtitle">
Create Your Account
</div>

<form action="/register" method="POST">

<div class="input-group">
<label>Full Name</label>
<input
type="text"
name="name"
placeholder="Full Name"
required>
</div>

<div class="input-group">
<label>Mobile Number</label>
<input
type="text"
name="mobile"
placeholder="Mobile Number"
required>
</div>

<div class="input-group">
<label>Email</label>
<input
type="email"
name="email"
placeholder="Email Address"
required>
</div>

<div class="input-group">
<label>Password</label>
<input
type="password"
name="password"
placeholder="Create Password"
required>
</div>

<button type="submit">
Register
</button>

</form>

<div class="login-link">
Already have an account?
<a href="/login.html">Login</a>
</div>

</div>

</body>
</html>
