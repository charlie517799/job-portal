
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WorkFinder</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<header class="navbar">

    <div class="logo">
        <i class="fa-solid fa-briefcase"></i>
        WorkFinder
    </div>

    <nav>
        <a href="#">Home</a>
        <a href="#jobs-container">Jobs</a>
        <a href="/about.html">About</a>
        <a href="/contact.html">Contact</a>
    </nav>

    <div class="nav-btns">
        <a href="#" onclick="showJobs('Government');return false;">
            Browse Jobs
        </a>

        <a href="/admin-login.html">
            Admin Login
        </a>
    </div>

</header>

<section class="hero">

    <div class="hero-left">

        <h1>
            Find Your<br>
            <span>Dream Job</span> Today
        </h1>

        <p>
            Explore thousands of job opportunities across
            top companies and government organizations.
        </p>

        <div class="hero-buttons">

            <a href="#"
               onclick="showJobs('Government');return false;">
               Government Jobs
            </a>

            <a href="#"
               onclick="showJobs('Corporate');return false;">
               Corporate Jobs
            </a>

        </div>

    </div>

    <div class="hero-right">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
             alt="Job Search">
    </div>

</section>

<div id="jobs-container"></div>

<footer class="footer-links">
    <a href="/about.html">About Us</a>
    <a href="/contact.html">Contact Us</a>
    <a href="/privacy.html">Privacy Policy</a>
    <a href="/terms.html">Terms & Conditions</a>
</footer>

<script>

async function showJobs(category='Government') {

    try {

        let apiUrl='/api/jobs/government';

        if(category==='Corporate'){
            apiUrl='/api/jobs/corporate';
        }

        const response=await fetch(apiUrl);
        const jobs=await response.json();

        const jobsContainer=
        document.getElementById('jobs-container');

        jobsContainer.innerHTML='';

        if(jobs.length===0){

            jobsContainer.innerHTML=
            `<div class="no-jobs">
                No Jobs Available
            </div>`;

            return;
        }

        jobs.forEach(job=>{

            jobsContainer.innerHTML += `
            <div class="job-card">

                <h2>${job.title}</h2>

                <p>
                <strong>Company:</strong>
                ${job.company}
                </p>

                <p>
                <strong>Location:</strong>
                ${job.location}
                </p>

                <p>
                ${job.description || ''}
                </p>

                <a class="apply-btn"
                   href="/apply.html?id=${job.id}">
                   Apply Now
                </a>

            </div>
            `;
        });

    } catch(err){

        console.log(err);
    }
}

window.onload=()=>{
    showJobs('Government');
};

</script>

</body>
</html>
```
