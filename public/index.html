<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4484833601433628"
     crossorigin="anonymous"></script>





  <title>WorkFinder</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background:
        linear-gradient(135deg, rgba(37, 99, 235, 0.85), rgba(15, 23, 42, 0.95)),
        url('https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=1600&q=80')
        center/cover no-repeat fixed;
      min-height: 100vh;
    }

    .hero {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 80px 20px 50px;
    }

    .glass-card {
      width: 100%;
      max-width: 900px;
      text-align: center;
      padding: 60px 40px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      color: white;
    }

    .glass-card h1 {
      margin: 0;
      font-size: 64px;
      font-weight: 800;
    }

    .glass-card p {
      margin-top: 18px;
      font-size: 22px;
      color: rgba(255, 255, 255, 0.9);
    }

    .hero-buttons {
      margin-top: 35px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .hero-buttons a {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 999px;
      background: white;
      color: #1d4ed8;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      transition: 0.3s;
      cursor: pointer;
    }

    .hero-buttons a:hover {
      transform: translateY(-4px);
      background: #eff6ff;
    }

    #jobs-container {
      max-width: 1100px;
      margin: 20px auto 60px;
      padding: 0 20px;
    }

    @media (max-width: 768px) {
      .glass-card h1 {
        font-size: 42px;
      }

      .hero-buttons a {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="glass-card">
      <h1>🚀 WorkFinder</h1>
      <p>Your Gateway to Government & Corporate Jobs</p>

      <div class="hero-buttons">
        <!-- return false lagane se link jump nahi karega -->
        <a href="#" onclick="showJobs('Government'); return false;">
          Government Jobs
        </a>

        <a href="#" onclick="showJobs('Corporate'); return false;">
          Corporate Jobs
        </a>

        <a href="/admin-login.html">
          Admin Panel
        </a>
      </div>
    </div>
  </div>

  <!-- Jobs list yahan show hogi -->
  <div id="jobs-container"></div>
<a href="/about.html">About Us</a>
<a href="/contact.html">Contact Us</a>
<a href="/privacy.html">Privacy Policy</a>
<a href="/terms.html">Terms & Conditions</a>
  <script src="script.js"></script>
</body>
</html>
