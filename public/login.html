<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opportunity Hub Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
padding:20px;
}

.login-box{
width:100%;
max-width:420px;
background:rgba(255,255,255,0.12);
backdrop-filter:blur(15px);
border-radius:25px;
padding:35px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.logo{
text-align:center;
font-size:32px;
font-weight:700;
color:#fff;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#dbeafe;
margin-bottom:30px;
font-size:14px;
}

.input-group{
margin-bottom:18px;
}

.input-group label{
display:block;
margin-bottom:8px;
color:#fff;
font-size:14px;
}

.input-group input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:rgba(255,255,255,.15);
color:white;
font-size:15px;
}

.input-group input::placeholder{
color:#d1d5db;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:white;
color:#2563eb;
font-size:16px;
font-weight:700;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.register{
margin-top:20px;
text-align:center;
color:white;
}

.register a{
color:#fff;
font-weight:600;
}

.note{
margin-top:15px;
text-align:center;
font-size:12px;
color:#dbeafe;
}

@media(max-width:480px){
.login-box{
padding:25px;
}
}
</style>
</head>
<body>

<div class="login-box">

<div class="logo">Opportunity Hub</div>

<div class="subtitle">
Login to Continue
</div>

<form action="/login" method="POST">

<div class="input-group">
<label>Email</label>
<input
type="email"
name="email"
placeholder="Enter Email"
required>
</div>

<div class="input-group">
<label>Password</label>
<input
type="password"
name="password"
placeholder="Enter Password"
required>
</div>

<button type="submit">
Login
</button>

</form>

<div class="register">
New User?
<a href="/register.html">Register Here</a>
</div>

<div class="note">
Admin and User both use this Login Page
</div>

</div>

</body>
</html>
