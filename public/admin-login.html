<!-- public/admin-login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - WorkFinder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        linear-gradient(135deg, rgba(37, 99, 235, 0.85), rgba(15, 23, 42, 0.95)),
        url('https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=1600&q=80')
        center/cover no-repeat fixed;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 45px 35px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      color: white;
      text-align: center;
    }

    .login-card h1 {
      margin: 0 0 10px;
      font-size: 36px;
      font-weight: 800;
    }

    .login-card p {
      margin: 0 0 30px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 16px;
    }

    .login-card input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .login-card button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: white;
      color: #1d4ed8;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .login-card button:hover {
      transform: translateY(-2px);
      background: #eff6ff;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: white;
      text-decoration: none;
      font-size: 14px;
      opacity: 0.9;
    }

    .back-link:hover {
      opacity: 1;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h1>🔐 Admin Login</h1>
    <p>Sign in to manage jobs and applications</p>

    <form action="/admin/login" method="POST">
      <input
        type="text"
        name="username"
        placeholder="Username"
        required
      />

      <input
        type="password"
        name="password"
        placeholder="Password"
        required
      />

      <button type="submit">Login</button>
    </form>

    <a href="/" class="back-link">← Back to Home</a>
  </div>

</body>
</html>
