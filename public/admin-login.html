
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Opportunity Hub Admin Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
  overflow:hidden;
}

.login-box{
  width:100%;
  max-width:430px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:28px;
  padding:45px;
  box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

.logo{
  text-align:center;
  color:white;
  font-size:34px;
  font-weight:700;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#dbeafe;
  margin-bottom:35px;
  font-size:15px;
}

.input-group{
  margin-bottom:22px;
}

.input-group label{
  display:block;
  margin-bottom:8px;
  color:white;
  font-size:14px;
  font-weight:500;
}

.input-group input{
  width:100%;
  padding:15px 18px;
  border:none;
  outline:none;
  border-radius:14px;
  font-size:15px;
  background:rgba(255,255,255,0.18);
  color:white;
}

.input-group input::placeholder{
  color:#d1d5db;
}

.login-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:white;
  color:#1d4ed8;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  transition:0.3s;
}

.login-btn:hover{
  transform:translateY(-2px);
  background:#dbeafe;
}

.bottom-text{
  margin-top:25px;
  text-align:center;
  color:#e5e7eb;
  font-size:14px;
}

.home-link{
  display:inline-block;
  margin-top:20px;
  width:100%;
  text-align:center;
  text-decoration:none;
  color:white;
  font-weight:500;
}

.home-link:hover{
  text-decoration:underline;
}

@media(max-width:500px){

  .login-box{
    margin:20px;
    padding:35px 25px;
  }

}
</style>
</head>
<body>

<div class="login-box">

  <div class="logo">Opportunity Hub</div>

  <div class="subtitle">
    Secure Admin Panel Login
  </div>

  <form action="/admin/login" method="POST">

    <div class="input-group">
      <label>Admin Username</label>

      <input
        type="text"
        name="username"
        placeholder="Enter username"
        required
      />
    </div>

    <div class="input-group">
      <label>Password</label>

      <input
        type="password"
        name="password"
        placeholder="Enter password"
        required
      />
    </div>

    <button type="submit" class="login-btn">
      Login to Dashboard
    </button>

  </form>

  <div class="bottom-text">
    Opportunity Hub Admin Access
  </div>

  <a href="/" class="home-link">
    ← Back to Website
  </a>

</div>

</body>
</html>
