<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Applications</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:#f4f7fb;
padding:30px;
}

.container{
max-width:1600px;
margin:auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h1{
text-align:center;
color:#14213d;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
}

th{
background:#2563eb;
color:white;
}

img{
width:70px;
border-radius:10px;
}

a{
color:#2563eb;
font-weight:700;
text-decoration:none;
}

.back{
display:inline-block;
margin-bottom:20px;
padding:12px 20px;
background:#2563eb;
color:white;
border-radius:10px;
text-decoration:none;
}
</style>
</head>
<body>

<div class="container">

<a href="/admin-dashboard.html" class="back">← Back</a>

<h1>All Applications</h1>

<table>
<thead>
<tr>
<th>Name</th>
<th>Mobile</th>
<th>Photo</th>
<th>Aadhaar</th>
<th>PAN</th>
<th>Address</th>
<th>Resume</th>
</tr>
</thead>

<tbody id="applicationsTable"></tbody>
</table>

</div>

<script>
fetch('/api/applications')
.then(res=>res.json())
.then(data=>{
const table=document.getElementById('applicationsTable');

data.forEach(app=>{
table.innerHTML+=`
<tr>
<td>${app.full_name}</td>
<td>${app.mobile}</td>
<td><img src="${app.photo}"></td>
<td><a href="${app.aadhaar}" target="_blank">View</a></td>
<td><a href="${app.pan_card}" target="_blank">View</a></td>
<td>${app.permanent_address}</td>
<td><a href="${app.resume}" target="_blank">Resume</a></td>
</tr>
`;
});
});
</script>

</body>
</html>
