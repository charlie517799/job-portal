<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job Portal Administration</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>Job Portal Administration</h1>

  <!-- Post New Job -->
  <h2>Create New Job Posting</h2>

  <form action="/admin/add-job" method="POST">
    <input
      type="text"
      name="title"
      placeholder="Job Title"
      required
    >

    <select name="company" required>
      <option value="">Select Category</option>
      <option>Government</option>
      <option>Corporate</option>
    </select>

    <input
      type="text"
      name="location"
      placeholder="Location"
    >

    <textarea
      name="description"
      placeholder="Job Description"
    ></textarea>

    <button type="submit">Post Job</button>
  </form>

  <!-- Top Buttons -->
  <div class="top-buttons">
    <a href="/applications.html">
  <button type="button">View Applications</button>
</a>
    <a href="/admin/logout">
      <button type="button" class="logout-btn">Logout</button>
    </a>
  </div>

  <!-- Jobs Section -->
  <div class="jobs-container">
    <h2>Active Job Listings</h2>
    <div id="jobs-list"></div>
  </div>

</div>

<script>
async function loadJobs() {
  try {
    const response = await fetch('/api/jobs');

    if (!response.ok) {
      throw new Error('Failed to fetch jobs');
    }

    const jobs = await response.json();
    const jobsList = document.getElementById('jobs-list');

    jobsList.innerHTML = '';

    if (!jobs.length) {
      jobsList.innerHTML =
        '<div class="empty">No jobs posted yet.</div>';
      return;
    }

    jobs.forEach(job => {
      jobsList.innerHTML += `
        <div class="job-card">
          <h3>${job.title}</h3>

          <p>
            <strong>Category:</strong>
            ${job.company || ''}
          </p>

          <p>
            <strong>Location:</strong>
            ${job.location || ''}
          </p>

          <p>${job.description || ''}</p>

          <a
            href="/admin/delete-job/${job.id}"
            class="delete-btn"
            onclick="return confirm('Are you sure you want to delete this job?')"
          >
            Delete Job
          </a>
        </div>
      `;
    });

  } catch (error) {
    console.error('Error loading jobs:', error);

    document.getElementById('jobs-list').innerHTML =
      '<div class="empty">Unable to load jobs.</div>';
  }
}

loadJobs();
</script>

</body>
</html>
