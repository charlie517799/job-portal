

```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Opportunity Hub Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#f4f7fb;
  color:#111827;
}

.sidebar{
  width:260px;
  height:100vh;
  position:fixed;
  left:0;
  top:0;
  background:linear-gradient(180deg,#111827,#1f2937);
  padding:30px 20px;
}

.logo{
  color:white;
  font-size:26px;
  font-weight:700;
  margin-bottom:40px;
}

.menu a{
  display:block;
  padding:14px 18px;
  margin-bottom:15px;
  text-decoration:none;
  color:#d1d5db;
  border-radius:14px;
  transition:0.3s;
  font-weight:500;
}

.menu a:hover{
  background:#2563eb;
  color:white;
  transform:translateX(5px);
}

.main{
  margin-left:260px;
  padding:40px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:35px;
}

.topbar h1{
  font-size:32px;
}

.logout-btn{
  background:#dc2626;
  color:white;
  padding:12px 22px;
  border-radius:12px;
  text-decoration:none;
  font-weight:600;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
  margin-bottom:40px;
}

.card{
  background:white;
  padding:30px;
  border-radius:22px;
  box-shadow:0 10px 30px rgba(0,0,0,0.07);
}

.card h2{
  font-size:38px;
  margin-bottom:10px;
  color:#2563eb;
}

.card p{
  color:#6b7280;
  font-weight:500;
}

.form-box{
  background:white;
  padding:35px;
  border-radius:22px;
  box-shadow:0 10px 30px rgba(0,0,0,0.07);
}

.form-box h2{
  margin-bottom:25px;
}

input,
textarea{
  width:100%;
  padding:15px;
  border:1px solid #d1d5db;
  border-radius:14px;
  margin-bottom:18px;
  font-size:15px;
  font-family:'Poppins',sans-serif;
}

textarea{
  resize:none;
  height:130px;
}

button{
  background:#2563eb;
  color:white;
  border:none;
  padding:15px 24px;
  border-radius:14px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#1d4ed8;
}

.quick-links{
  margin-top:35px;
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.quick-links a{
  background:white;
  padding:18px 25px;
  text-decoration:none;
  color:#111827;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,0.06);
  font-weight:600;
  transition:0.3s;
}

.quick-links a:hover{
  transform:translateY(-5px);
  background:#2563eb;
  color:white;
}

@media(max-width:900px){

  .sidebar{
    width:100%;
    height:auto;
    position:relative;
  }

  .main{
    margin-left:0;
    padding:20px;
  }

  .stats{
    grid-template-columns:1fr;
  }

}
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">Opportunity Hub</div>

  <div class="menu">
    <a href="/">🏠 Home</a>
    <a href="/applications.html">📋 Applications</a>
    <a href="/admin/logout">🚪 Logout</a>
  </div>
</div>

<div class="main">

  <div class="topbar">
    <h1>Admin Dashboard</h1>

    <a href="/admin/logout" class="logout-btn">
      Logout
    </a>
  </div>

  <div class="stats">

    <div class="card">
      <h2 id="totalJobs">0</h2>
      <p>Total Jobs Posted</p>
    </div>

    <div class="card">
      <h2 id="totalApplications">0</h2>
      <p>Total Applications</p>
    </div>

    <div class="card">
      <h2 id="systemStatus">0%</h2>
      <p>System Working</p>
    </div>

  </div>

  <div class="form-box">

    <h2>Post New Job</h2>

    <form action="/admin/add-job" method="POST">

      <select
        name="category"
        required
        style="width:100%;padding:15px;border:1px solid #d1d5db;border-radius:14px;margin-bottom:18px;font-size:15px;font-family:'Poppins',sans-serif;"
      >
        <option value="">Select Job Category</option>
        <option value="Government">Government Job</option>
        <option value="Corporate">Corporate Job</option>
      </select>

      <input
        type="text"
        name="title"
        placeholder="Job Title"
        required
      />

      <input
        type="text"
        name="company"
        placeholder="Company Name"
        required
      />

      <input
        type="text"
        name="location"
        placeholder="Job Location"
        required
      />

      <textarea
        name="description"
        placeholder="Job Description"
        required
      ></textarea>

      <button type="submit">
        Post Job
      </button>

    </form>

  </div>

  <div class="quick-links">

    <a href="/applications.html">
      📋 View Applications
    </a>

    <a href="/">
      🌐 Visit Website
    </a>

  </div>

</div>
<script>

async function loadDashboardStats() {

  try {

    const response = await fetch(
      '/api/dashboard-stats',
      {
        method: 'GET',
        credentials: 'same-origin'
      }
    );

    if (!response.ok) {
      throw new Error('API failed');
    }

    const data = await response.json();

    document.getElementById('totalJobs').innerHTML =
      data.totalJobs;

    document.getElementById('totalApplications').innerHTML =
      data.totalApplications;

    document.getElementById('systemStatus').innerHTML =
      data.systemStatus;

  } catch (error) {

    console.log('Dashboard Error:', error);

  }

}

window.onload = loadDashboardStats;

</script>
</body>
</html>
