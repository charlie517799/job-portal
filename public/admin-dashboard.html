<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>

  <style>

    body{
      margin:0;
      padding:30px;
      font-family:Arial;
      background:#f1f5f9;
    }

    h1{
      text-align:center;
      color:#1e293b;
    }

    .box{
      max-width:900px;
      margin:auto;
      background:white;
      padding:25px;
      border-radius:12px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    input,
    textarea,
    select{
      width:100%;
      padding:12px;
      margin-top:12px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:16px;
      box-sizing:border-box;
    }

    button{
      width:100%;
      padding:14px;
      margin-top:15px;
      border:none;
      background:#2563eb;
      color:white;
      font-size:18px;
      border-radius:8px;
      cursor:pointer;
    }

    button:hover{
      background:#1d4ed8;
    }

    .job-card{
      background:white;
      padding:20px;
      border-radius:10px;
      margin-top:20px;
      border-left:5px solid #2563eb;
    }

    .delete-btn{
      display:inline-block;
      margin-top:10px;
      background:red;
      color:white;
      padding:10px 15px;
      border-radius:6px;
      text-decoration:none;
    }

  </style>
</head>

<body>

  <div class="box">

    <h1>Admin Dashboard</h1>

    <form action="/admin/add-job" method="POST">

      <select name="category" required>
        <option value="">Select Category</option>
        <option value="Government">Government</option>
        <option value="Corporate">Corporate</option>
      </select>

      <input
        type="text"
        name="title"
        placeholder="Job Title"
        required
      >

      <input
        type="text"
        name="company"
        placeholder="Company Name"
        required
      >

      <input
        type="text"
        name="location"
        placeholder="Location"
        required
      >

      <input
        type="text"
        name="salary"
        placeholder="Salary"
      >

      <textarea
        name="description"
        placeholder="Job Description"
        rows="5"
        required
      ></textarea>

      <input
        type="text"
        name="apply_link"
        placeholder="Apply Link"
      >

      <button type="submit">
        Post Job
      </button>

    </form>

    <hr>

    <h2>Posted Jobs</h2>

    <div id="jobs"></div>

  </div>

  <script>

    async function loadJobs(){

      const response =
        await fetch('/api/admin/jobs');

      const jobs =
        await response.json();

      const jobsDiv =
        document.getElementById('jobs');

      jobsDiv.innerHTML = '';

      jobs.forEach(job => {

        jobsDiv.innerHTML += `

          <div class="job-card">

            <h3>${job.title}</h3>

            <p>
              <b>Company:</b>
              ${job.company}
            </p>

            <p>
              <b>Category:</b>
              ${job.category}
            </p>

            <p>
              <b>Location:</b>
              ${job.location}
            </p>

            <p>
              <b>Salary:</b>
              ${job.salary || ''}
            </p>

            <a
              class="delete-btn"
              href="/admin/delete-job/${job.id}"
              onclick="return confirm('Delete this job?')"
            >
              Delete
            </a>

          </div>

        `;

      });

    }

    loadJobs();

  </script>

</body>
</html>
