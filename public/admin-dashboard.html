<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#f4f7fb;
}

.container{
  max-width:1400px;
  margin:30px auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h1{
  text-align:center;
  color:#14213d;
}

.top-buttons{
  display:flex;
  gap:15px;
  margin-bottom:25px;
}

.btn{
  padding:14px 24px;
  border:none;
  border-radius:12px;
  color:white;
  cursor:pointer;
  font-weight:700;
}

.blue{background:#2563eb;}
.red{background:#ef4444;}
.green{background:#16a34a;}

input,select,textarea{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  padding:14px;
  border-bottom:1px solid #eee;
  text-align:left;
}

th{
  background:#2563eb;
  color:white;
}

img{
  width:60px;
  border-radius:10px;
}
</style>
</head>
<body>

<div class="container">

<h1>🚀 Admin Dashboard</h1>

<div class="top-buttons">
<a href="#applications"><button class="btn blue">📄 All Applications</button></a>
<a href="/admin/logout"><button class="btn red">Logout</button></a>
</div>

<h2>Post New Job</h2>

<form action="/admin/add-job" method="POST">
<select name="category" required>
<option value="Government">Government</option>
<option value="Corporate">Corporate</option>
</select>

<input type="text" name="title" placeholder="Job Title" required>
<input type="text" name="company" placeholder="Company Name" required>
<input type="text" name="location" placeholder="Location" required>
<input type="text" name="salary" placeholder="Salary">
<textarea name="description" placeholder="Description"></textarea>
<input type="text" name="apply_link" placeholder="Apply Link">

<button class="btn green" type="submit">Post Job</button>
</form>

<h2 id="applications">All Applications</h2>

<table>
<thead>
<tr>
<th>Name</th>
<th>Mobile</th>
<th>Age</th>
<th>Gender</th>
<th>Marital</th>
<th>Photo</th>
<th>Permanent Address</th>
<th>Current Address</th>
<th>Resume</th>
</tr>
</thead>

<tbody id="applicationsTable"></tbody>
</table>

</div>

<script>
fetch('/api/applications')
.then(res=>res.json())
.then(data=>{
const table=document.getElementById('applicationsTable');

data.forEach(app=>{
table.innerHTML+=`
<tr>
<td>${app.full_name}</td>
<td>${app.mobile}</td>
<td>${app.age}</td>
<td>${app.gender}</td>
<td>${app.marital_status}</td>
<td><img src="${app.photo}" /></td>
<td>${app.permanent_address}</td>
<td>${app.current_address}</td>
<td><a href="${app.resume}" target="_blank">View Resume</a></td>
</tr>
`;
});
});
</script>

</body>
</html>
