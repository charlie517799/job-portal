<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
padding:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#2563eb,#0f172a);
min-height:100vh;
}

.container{
max-width:900px;
margin:40px auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
text-align:center;
margin-bottom:30px;
color:#111827;
}

h2{
margin-top:20px;
color:#2563eb;
}

form{
display:flex;
flex-direction:column;
gap:15px;
}

input,
select,
textarea{
padding:14px;
border-radius:10px;
border:1px solid #d1d5db;
font-size:16px;
outline:none;
}

textarea{
min-height:120px;
resize:none;
}

button{
padding:14px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#1d4ed8;
}

.top-buttons{
display:flex;
gap:15px;
margin-top:20px;
flex-wrap:wrap;
}

.jobs-container{
margin-top:40px;
}

.job-card{
background:#f9fafb;
padding:20px;
border-radius:16px;
margin-bottom:20px;
border:1px solid #e5e7eb;
}

.job-card h3{
margin-top:0;
color:#111827;
}

.delete-btn{
display:inline-block;
padding:10px 16px;
background:red;
color:white;
text-decoration:none;
border-radius:8px;
margin-top:10px;
}

.delete-btn:hover{
background:darkred;
}

.empty{
text-align:center;
padding:20px;
background:#f3f4f6;
border-radius:12px;
}

</style>

</head>

<body>

<div class="container">

<h1>⚡ Admin Dashboard</h1>

<h2>Post New Job</h2>

<form action="/admin/add-job" method="POST">

<input
type="text"
name="title"
placeholder="Job Title"
required
>

<select name="company" required>
<option value="">Select Category</option>
<option>Government</option>
<option>Corporate</option>
</select>

<input
type="text"
name="location"
placeholder="Location"
>

<textarea
name="description"
placeholder="Job Description"
></textarea>

<button type="submit">
Post Job
</button>

</form>

<div class="top-buttons">

<a href="/admin/applications">
<button type="button">
📋 View Applications
</button>
</a>

<a href="/admin/logout">
<button
type="button"
style="background:red;"
>
🚪 Logout
</button>
</a>

</div>

<div class="jobs-container">

<h2>📌 Posted Jobs</h2>

<div id="jobs-list"></div>

</div>

</div>

<script>

async function loadJobs() {

  try {

    const response = await fetch('/api/jobs');

    const jobs = await response.json();

    const jobsList = document.getElementById('jobs-list');

    jobsList.innerHTML = '';

    if (jobs.length === 0) {

      jobsList.innerHTML = `
        <div class="empty">
          No Jobs Posted Yet
        </div>
      `;

      return;
    }

    jobs.forEach((job) => {

      jobsList.innerHTML += `

        <div class="job-card">

          <h3>${job.title}</h3>

          <p><strong>Category:</strong> ${job.company}</p>

          <p><strong>Location:</strong> ${job.location}</p>

          <p>${job.description}</p>

          <a
            href="/admin/delete-job/${job.id}"
            class="delete-btn"
            onclick="return confirm('Delete this job?')"
          >
            Delete Job
          </a>

        </div>

      `;
    });

  } catch (error) {

    console.log(error);

  }

}

loadJobs();

</script>

</body>
</html>
