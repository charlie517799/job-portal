<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job Portal Administration</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>Job Portal Administration</h1>

  <!-- Post New Job -->
  <h2>Create New Job Posting</h2>

  <form action="/admin/add-job" method="POST">
    <input type="text" name="title" placeholder="Job Title" required>

    <select name="company" required>
      <option value="">Select Category</option>
      <option>Government</option>
      <option>Corporate</option>
    </select>

    <input type="text" name="location" placeholder="Location">

    <textarea name="description" placeholder="Job Description"></textarea>

    <button type="submit">Post Job</button>
  </form>

  <!-- Top Buttons -->
  <div class="top-buttons">
    <a href="#applications-section">
      <button type="button">View Applications</button>
    </a>

    <a href="/admin/logout">
      <button type="button" class="logout-btn">Logout</button>
    </a>
  </div>

  <!-- Jobs Section -->
  <div class="jobs-container">
    <h2>Active Job Listings</h2>
    <div id="jobs-list"></div>
  </div>

  <!-- Applications Section -->
  <div class="applications-container" id="applications-section">
    <h2>Candidate Applications</h2>
    <div id="applications-list"></div>
  </div>

</div>

<script>
async function loadJobs() {
  try {
    const response = await fetch('/api/jobs');
    const jobs = await response.json();

    const jobsList = document.getElementById('jobs-list');
    jobsList.innerHTML = '';

    if (!jobs.length) {
      jobsList.innerHTML =
        '<div class="empty">No jobs posted yet.</div>';
      return;
    }

    jobs.forEach(job => {
      jobsList.innerHTML += `
        <div class="job-card">
          <h3>${job.title}</h3>
          <p><strong>Category:</strong> ${job.company || ''}</p>
          <p><strong>Location:</strong> ${job.location || ''}</p>
          <p>${job.description || ''}</p>

          <a
            href="/admin/delete-job/${job.id}"
            class="delete-btn"
            onclick="return confirm('Are you sure you want to delete this job?')"
          >
            Delete Job
          </a>
        </div>
      `;
    });
  } catch (error) {
    console.error('Error loading jobs:', error);
    document.getElementById('jobs-list').innerHTML =
      '<div class="empty">Unable to load jobs.</div>';
  }
}

async function loadApplications() {
  try {
    const response = await fetch('/api/applications');

    if (!response.ok) {
      throw new Error('Failed to fetch applications');
    }

    const applications = await response.json();
    const applicationsList = document.getElementById('applications-list');
    applicationsList.innerHTML = '';

    if (!applications.length) {
      applicationsList.innerHTML =
        '<div class="empty">No applications yet.</div>';
      return;
    }

    applications.forEach(app => {
      applicationsList.innerHTML += `
        <div class="application-card">
          <h3>${app.full_name}</h3>

          <p><strong>Applied For:</strong> ${app.job_title || 'N/A'}</p>
          <p><strong>Mobile:</strong> ${app.mobile || ''}</p>
          <p><strong>Age:</strong> ${app.age || ''}</p>
          <p><strong>Date of Birth:</strong> ${app.dob || ''}</p>
          <p><strong>Gender:</strong> ${app.gender || ''}</p>
          <p><strong>Marital Status:</strong> ${app.marital_status || ''}</p>
          <p><strong>Permanent Address:</strong> ${app.permanent_address || ''}</p>
          <p><strong>Current Address:</strong> ${app.current_address || ''}</p>

          ${app.photo ? `<a class="file-link" href="${app.photo}" target="_blank">Photo</a>` : ''}
          ${app.aadhaar ? `<a class="file-link" href="${app.aadhaar}" target="_blank">Aadhaar</a>` : ''}
          ${app.pan_card ? `<a class="file-link" href="${app.pan_card}" target="_blank">PAN Card</a>` : ''}
          ${app.resume ? `<a class="file-link" href="${app.resume}" target="_blank">Resume</a>` : ''}
        </div>
      `;
    });
  } catch (error) {
    console.error('Error loading applications:', error);
    document.getElementById('applications-list').innerHTML =
      '<div class="empty">Unable to load applications.</div>';
  }
}

loadJobs();
loadApplications();
</script>

</body>
</html>
