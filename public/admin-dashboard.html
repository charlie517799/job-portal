<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
body{
margin:0;
font-family:Segoe UI,sans-serif;
background:#f4f7fb;
}

.container{
max-width:1500px;
margin:30px auto;
background:#fff;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h1,h2{
text-align:center;
color:#14213d;
}

.top-buttons{
display:flex;
gap:15px;
margin-bottom:25px;
}

.btn{
padding:14px 24px;
border:none;
border-radius:12px;
color:white;
cursor:pointer;
font-weight:700;
}

.blue{background:#2563eb;}
.red{background:#ef4444;}
.green{background:#16a34a;}

input,select,textarea{
width:100%;
padding:14px;
margin:8px 0;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
font-size:14px;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#2563eb;
color:white;
}

img{
width:70px;
border-radius:10px;
}

a{
color:#2563eb;
text-decoration:none;
font-weight:600;
}

.delete-btn{
background:#ef4444;
color:white;
padding:8px 14px;
border:none;
border-radius:8px;
cursor:pointer;
}

#applicationsSection{
display:none;
margin-top:40px;
}
</style>
</head>
<body>

<div class="container">

<h1>🚀 Admin Dashboard</h1>

<div class="top-buttons">
<button class="btn blue" onclick="toggleApplications()">📄 All Applications</button>
<a href="/admin/logout"><button class="btn red">Logout</button></a>
</div>

<h2>Post New Job</h2>

<form action="/admin/add-job" method="POST">
<select name="category" required>
<option value="Government">Government</option>
<option value="Corporate">Corporate</option>
</select>

<input type="text" name="title" placeholder="Job Title" required>
<input type="text" name="company" placeholder="Company Name" required>
<input type="text" name="location" placeholder="Location" required>
<input type="text" name="salary" placeholder="Salary">
<textarea name="description" placeholder="Job Description"></textarea>
<input type="text" name="apply_link" placeholder="Apply Link">

<button class="btn green" type="submit">Post Job</button>
</form>

<div id="applicationsSection">

<h2>All Applications</h2>

<table>
<thead>
<tr>
<th>Name</th>
<th>Mobile</th>
<th>Age</th>
<th>Gender</th>
<th>Marital</th>
<th>Photo</th>
<th>Aadhaar</th>
<th>PAN</th>
<th>Permanent Address</th>
<th>Current Address</th>
<th>Resume</th>
<th>Action</th>
</tr>
</thead>

<tbody id="applicationsTable"></tbody>
</table>

</div>

</div>

<script>

function toggleApplications(){
const section=document.getElementById('applicationsSection');

if(section.style.display==="none" || section.style.display===""){
section.style.display="block";
}else{
section.style.display="none";
}
}

fetch('/api/applications')
.then(res=>res.json())
.then(data=>{
const table=document.getElementById('applicationsTable');

data.forEach(app=>{
table.innerHTML+=`
<tr>
<td>${app.full_name || ''}</td>
<td>${app.mobile || ''}</td>
<td>${app.age || ''}</td>
<td>${app.gender || ''}</td>
<td>${app.marital_status || ''}</td>

<td>${app.photo ? `<img src="${app.photo}">` : 'No Photo'}</td>

<td>${app.aadhaar ? `<a href="${app.aadhaar}" target="_blank">View Aadhaar</a>` : 'No File'}</td>

<td>${app.pan_card ? `<a href="${app.pan_card}" target="_blank">View PAN</a>` : 'No File'}</td>

<td>${app.permanent_address || ''}</td>
<td>${app.current_address || ''}</td>

<td>${app.resume ? `<a href="${app.resume}" target="_blank">View Resume</a>` : 'No Resume'}</td>

<td>
<button class="delete-btn" onclick="deleteApplication(${app.id})">Delete</button>
</td>
</tr>
`;
});
});

function deleteApplication(id){
if(confirm('Delete this application?')){
fetch('/api/applications/'+id,{
method:'DELETE'
})
.then(()=>location.reload());
}
}
</script>

</body>
</html>
