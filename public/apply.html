<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply Job</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#2563eb,#0f172a);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:100%;
    max-width:850px;
    background:white;
    padding:40px;
    border-radius:24px;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
}

h2{
    text-align:center;
    color:#1e3a8a;
    margin-bottom:30px;
    font-size:38px;
}

input,select,textarea{
    width:100%;
    padding:16px;
    margin-bottom:16px;
    border:1px solid #cbd5e1;
    border-radius:14px;
    font-size:16px;
}

label{
    font-weight:700;
    color:#334155;
}

button{
    width:100%;
    padding:18px;
    border:none;
    border-radius:14px;
    background:#2563eb;
    color:white;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}
</style>
</head>

<body>

<div class="container">
<h2>📝 Job Application Form</h2>

<p id="job-id-status"></p>

<form action="/apply" method="POST" enctype="multipart/form-data">

<input type="hidden" name="job_id" id="job_id"/>

<input type="text" name="full_name" placeholder="Full Name" required>

<input type="email" name="email" placeholder="Email Address" required>

<input type="text" name="mobile" placeholder="Mobile Number" required>

<input type="date" name="dob" required>

<select name="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<select name="marital_status" required>
<option value="">Marital Status</option>
<option>Single</option>
<option>Married</option>
</select>

<input type="text" name="qualification" placeholder="Qualification" required>

<input type="text" name="experience" placeholder="Work Experience">

<textarea name="skills" placeholder="Skills"></textarea>

<textarea name="permanent_address" placeholder="Permanent Address" required></textarea>

<textarea name="current_address" placeholder="Current Address" required></textarea>

<label>Upload Photo</label>
<input type="file" name="photo" accept="image/*" required>

<label>Upload Aadhaar</label>
<input type="file" name="aadhaar" required>

<label>Upload PAN Card</label>
<input type="file" name="pan_card" required>

<label>Upload Resume</label>
<input type="file" name="resume" required>

<button type="submit">Submit Application</button>

</form>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const jobId = params.get('job_id') || params.get('id');

document.getElementById('job_id').value = jobId || '';
</script>

</body>
</html>
