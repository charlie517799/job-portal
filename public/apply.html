
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply Job</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#2563eb,#0f172a);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:100%;
    max-width:850px;
    background:#fff;
    padding:40px;
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
}

h2{
    text-align:center;
    color:#1e3a8a;
    margin-bottom:25px;
}

input,
select,
textarea{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    box-sizing:border-box;
    font-size:15px;
}

textarea{
    resize:vertical;
    min-height:90px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

button:disabled{
    background:#94a3b8;
    cursor:not-allowed;
}

.loading{
    display:none;
    text-align:center;
    margin-top:15px;
    font-weight:bold;
    color:#2563eb;
}
</style>
</head>
<body>

<div class="container">

<h2>📝 Job Application Form</h2>

<form id="applyForm" action="/apply" method="POST" enctype="multipart/form-data">

<input type="hidden" name="job_id" id="job_id">

<input type="text" name="full_name" placeholder="Full Name" required>

<input type="email" name="email" placeholder="Email Address" required>

<input type="text" name="mobile" placeholder="Mobile Number" required>

<input type="date" name="dob" required>

<select name="gender" required>
<option value="">Select Gender</option>
<option value="Male">Male</option>
<option value="Female">Female</option>
<option value="Other">Other</option>
</select>

<select name="marital_status" required>
<option value="">Marital Status</option>
<option value="Single">Single</option>
<option value="Married">Married</option>
</select>

<input type="text" name="qualification" placeholder="Qualification" required>

<input type="text" name="experience" placeholder="Work Experience">

<textarea name="skills" placeholder="Skills"></textarea>

<textarea name="permanent_address" placeholder="Permanent Address" required></textarea>

<textarea name="current_address" placeholder="Current Address" required></textarea>

<label>Upload Photo</label>
<input type="file" name="photo" accept="image/*" required>

<label>Upload Aadhaar</label>
<input type="file" name="aadhaar" required>

<label>Upload PAN Card</label>
<input type="file" name="pan_card" required>

<label>Upload Resume</label>
<input type="file" name="resume" accept=".pdf,.doc,.docx" required>

<button type="submit" id="submitBtn">
    Submit Application
</button>

<div class="loading" id="loadingMsg">
    ⏳ Please wait... Uploading documents...
</div>

</form>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const jobId = params.get("job_id") || params.get("id");

document.getElementById("job_id").value = jobId || "";

const form = document.getElementById("applyForm");
const submitBtn = document.getElementById("submitBtn");
const loadingMsg = document.getElementById("loadingMsg");

form.addEventListener("submit", function(e){

    const maxSize = 5 * 1024 * 1024;

    const files = [
        document.querySelector('input[name="photo"]').files[0],
        document.querySelector('input[name="aadhaar"]').files[0],
        document.querySelector('input[name="pan_card"]').files[0],
        document.querySelector('input[name="resume"]').files[0]
    ];

    for(let file of files){
        if(file && file.size > maxSize){
            alert("Each file must be less than 5MB");
            e.preventDefault();
            return;
        }
    }

    submitBtn.disabled = true;
    submitBtn.innerText = "Submitting...";
    loadingMsg.style.display = "block";
});

</script>

</body>
